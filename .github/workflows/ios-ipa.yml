name: Build iOS IPA

# Produces an unsigned .ipa on a macOS runner.
#
# WHY THIS EXISTS
# ---------------
# An .ipa cannot be built on Windows: Apple's iOS SDK and Xcode are macOS-only,
# and the SDK licence forbids use on other platforms. This workflow runs the
# real Xcode toolchain on GitHub's macOS runner, so a Windows machine can
# produce a genuine binary.
#
# It is built with CODE_SIGNING_ALLOWED=NO, which yields an UNSIGNED ipa.
# That is exactly what Sideloadly / AltStore / AltStore-Side require: they
# apply the user's own Apple ID signature at install time.
#
# To download: open the repo -> Actions -> this workflow -> the run ->
# "Artifacts" -> download the .zip, unzip, install the .ipa.
#
# NOTE ON EXPIRY: an app signed with a FREE Apple ID expires after 7 days and
# must be re-signed and reinstalled each week. That limit is imposed by Apple
# on free provisioning profiles and cannot be bypassed by any build setting.
# A paid Apple Developer Program membership ($99/yr) gives a 1-year profile.
# If the 7-day re-sign is unacceptable, use the PWA at
# https://ai.ambicdigital.in/pwa/ instead, which never expires.

on:
  push:
    paths:
      - "AISCompanion/**"
      - "project.yml"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    # `permissions` is only valid at workflow or JOB level. Placing it under a
    # step is ignored, and the "Publish failure log" step then cannot push.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Do NOT hardcode a version. GitHub rotates the runner image and a
          # pinned /Applications/Xcode_<version>.app will eventually disappear,
          # failing the build before it starts. Pick the newest one present.
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "No Xcode found on runner"; exit 1; fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: .
        run: |
          xcodegen generate
          # Confirm the scheme actually exists. A missing scheme is a common
          # cause of "exit code 65" that looks like a compile failure.
          xcodebuild -list -project AISCompanion.xcodeproj

      - name: Build unsigned ipa
        working-directory: .
        run: |
          set -uo pipefail
          rm -rf build
          xcodebuild \
            -project AISCompanion.xcodeproj \
            -scheme AISCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            -archivePath build/AISCompanion.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build/xcodebuild.log
          STATUS=${PIPESTATUS[0]}

          # Surface the real error in the run SUMMARY, which is visible on the
          # run page without signing in. The raw log is also uploaded as an
          # artifact, which is likewise downloadable anonymously.
          {
            echo "### xcodebuild exit code: $STATUS"
            echo ""
            echo '```'
            grep -E "error:|warning: .*deprecat|BUILD FAILED|does not contain a scheme|The following build commands failed" build/xcodebuild.log | head -60 || echo "(no error lines matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            echo "--- last 40 lines of build log ---" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 build/xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

          mkdir -p build/Payload
          APP=$(find build/AISCompanion.xcarchive/Products -name "AISCompanion.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "app bundle not found in archive" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp -R "$APP" build/Payload/
          cd build
          zip -qry ../AISCompanion-unsigned.ipa Payload
          cd ..
          echo "Built:"; ls -la AISCompanion-unsigned.ipa

      - name: Upload build log
        # Uploaded on failure too, and downloadable without signing in, so the
        # real compiler error is never hidden behind the auth wall.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish failure log
        # The run log and artifacts are both behind GitHub's auth wall, which
        # makes a failure undiagnosable without an account. Committing the log
        # makes it readable from raw.githubusercontent.com with no auth at all.
        # Written to the repo root, which is outside the workflow's `paths`
        # trigger, so publishing a failure does not start another build.
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "# xcodebuild failure report"
            echo
            echo "Generated by the Build iOS IPA workflow."
            echo
            echo '## Error lines'
            echo '```'
            grep -E "error:|BUILD FAILED|does not contain a scheme|Command .* failed" build/xcodebuild.log 2>/dev/null | head -80 || echo "(none matched)"
            echo '```'
            echo
            echo '## Last 120 lines'
            echo '```'
            tail -120 build/xcodebuild.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } > xcodebuild-error.txt

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xcodebuild-error.txt
          git commit -m "chore: publish xcodebuild failure log" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "could not push log"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AISCompanion-unsigned-ipa
          path: AISCompanion-unsigned.ipa
          if-no-files-found: error
